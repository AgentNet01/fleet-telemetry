<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet Hub</title>
<style>
:root{
  --bg:#0d0f14; --panel:#161922; --panel2:#1c2029; --line:#272c38; --fg:#e9ecf3; --dim:#8b93a7;
  --ok:#3fb950; --idle:#6b7280; --warn:#d6a333; --bad:#f05d57; --accent:#5aa2ff; --money:#44d07b;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f5f8; --panel:#fff; --panel2:#f6f8fb; --line:#e3e7ee; --fg:#1a1e27; --dim:#5c6473; --accent:#0a66d6; --money:#13914f;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:0 auto;padding:16px 16px 60px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:17px;margin:0;letter-spacing:.2px}
.fresh{color:var(--dim);font-size:12px}
.hero{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.hero .lbl{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.hero .big{font-size:40px;font-weight:700;color:var(--money);line-height:1.1;margin:2px 0 8px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--dim)}
.chip b{color:var(--fg);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{flex:0 0 auto;background:none;border:0;color:var(--dim);font:inherit;font-size:13px;font-weight:600;padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin:18px 2px 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);color:inherit;font:inherit;padding:12px 14px;cursor:pointer}
.row:first-child{border-top:0}
.nj .row{cursor:default}
.nj .empty,.muted{color:var(--dim)}
.agent{display:grid;grid-template-columns:12px 1fr auto;gap:11px;align-items:start}
.dot{width:10px;height:10px;border-radius:50%;margin-top:4px}
.s-working{background:var(--ok)} .s-idle{background:var(--idle)} .s-unresponsive{background:var(--bad)}
.s-login{background:var(--warn)} .s-parked{background:transparent;border:2px solid var(--idle);width:8px;height:8px}
.nm{font-weight:600} .nm .tag{font-weight:500;color:var(--accent);font-size:12px;margin-left:6px}
.what{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ages{color:var(--dim);font-size:12px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.prod{padding:14px}
.prod .phead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prod .pname{font-weight:600;font-size:15px}
.prod .prev{color:var(--money);font-variant-numeric:tabular-nums}
.prod .brief{color:var(--dim);font-size:13px;margin:2px 0 10px}
.proj{margin:10px 0 0}
.proj .pj{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.task{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px;border-top:1px solid var(--line)}
.task .st{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.st.working{color:var(--ok)} .st.done{color:var(--money)} .st.blocked{color:var(--warn)} .st.ready{color:var(--accent)} .st.verifying{color:var(--accent)}
.task .blk{color:var(--warn);font-size:12px}
.ev{border-left:3px solid var(--line);padding:6px 10px;margin:8px 0;white-space:pre-wrap;word-break:break-word;font-size:14px}
.ev.in{border-color:var(--accent)} .ev.out{border-color:var(--ok)} .ev.waiting{border-style:dashed}
.ev small{display:block;color:var(--dim);font-size:12px;margin-bottom:2px}
.coun{padding:13px 14px}
.coun .q{font-weight:600;margin-bottom:6px}
.coun .ans{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre-wrap;font-size:14px}
.coun .view{font-size:13px;color:var(--dim);padding:2px 0}
.coun .view b{color:var(--fg)}
.back{background:none;border:0;color:var(--accent);font:inherit;padding:0;margin-bottom:10px;cursor:pointer}
.vrow{display:grid;grid-template-columns:1fr auto;gap:10px;font-size:14px}
.vrow .sc{color:var(--dim);font-size:12px}
@media(max-width:430px){.hero .big{font-size:34px}}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Fleet Hub</h1><span class="fresh" id="fresh">Loading…</span></div>
  <div class="hero">
    <div class="lbl">Revenue · made so far</div>
    <div class="big" id="money">$0.00</div>
    <div class="chips" id="revchips"></div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab" data-tab="overview" aria-selected="true">Overview</button>
    <button class="tab" data-tab="portfolio">Portfolio</button>
    <button class="tab" data-tab="council">Council</button>
    <button class="tab" data-tab="vault">Vault</button>
  </div>
  <section id="overview">
    <h2>Needs Jack <span id="njn"></span></h2>
    <div class="card nj" id="nj"></div>
    <h2>Agents</h2>
    <div class="card" id="agents"></div>
  </section>
  <section id="portfolio" hidden><div id="products"></div></section>
  <section id="council" hidden><div id="councils"></div></section>
  <section id="vault" hidden>
    <h2>Secrets</h2><div class="card" id="secrets"></div>
    <h2>Read log</h2><div class="card" id="reads"></div>
  </section>
  <section id="detail" hidden>
    <button class="back" id="back">← All agents</button>
    <h2 id="dname"></h2><div class="card" style="padding:4px 14px" id="tl"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = n => "$" + (n || 0).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
let now = Date.now() / 1000, openAgent = null, tab = "overview";
function ago(t){ if(!t) return "never"; const s=Math.max(0,now-t);
  return s<90?`${Math.round(s)}s ago`:s<5400?`${Math.round(s/60)}m ago`:s<129600?`${Math.round(s/3600)}h ago`:`${Math.round(s/86400)}d ago`; }
function stateOf(a){ if(["unresponsive","login","parked"].includes(a.state)) return a.state; return a.current?"working":"idle"; }
function label(a){ const s=stateOf(a);
  if(s==="login") return "Login needs renewing"; if(s==="unresponsive") return "Unresponsive";
  if(s==="parked") return a.queue?`Parked · ${a.queue} held`:"Parked";
  if(a.current) return `#${a.current.id}: ${a.current.text}`;
  return a.queue?`Idle · ${a.queue} waiting`:"Idle"; }

async function jget(p){ const r=await fetch(p,{cache:"no-store"}); return r.ok?r.json():null; }

async function load(){
  const b = await jget("api/board"); if(!b) return;
  now = b.now;
  $("fresh").textContent = "Updated " + new Date(b.now*1000).toLocaleTimeString();
  $("money").textContent = money(b.revenue && b.revenue.total);
  const by = (b.revenue && b.revenue.by_product) || {};
  $("revchips").innerHTML = Object.keys(by).length
    ? Object.entries(by).map(([k,v])=>`<span class="chip">${esc(k||"unassigned")} <b>${money(v)}</b></span>`).join("")
    : `<span class="chip muted">no sales yet</span>`;

  const nj = b.needs_jack || [];
  $("njn").innerHTML = nj.length ? `<span style="color:var(--warn)">(${nj.length})</span>` : "";
  $("nj").innerHTML = nj.length
    ? nj.map(n=>`<div class="row"><div>${esc(n.text)}</div><div class="what">${ago(n.at)}</div></div>`).join("")
    : `<div class="row"><span class="empty">Nothing needs you.</span></div>`;

  const ags = (b.agents||[]).slice().sort((x,y)=>x.name.localeCompare(y.name,undefined,{numeric:true}));
  $("agents").innerHTML = ags.map(a=>{
    const tag = a.product ? `<span class="tag">${esc(a.product)} · ${esc(a.role||"")}</span>` : "";
    return `<button class="row agent" data-agent="${esc(a.name)}">
      <span class="dot s-${stateOf(a)}"></span>
      <span style="min-width:0"><div class="nm">${esc(a.name)}${tag}</div><div class="what">${esc(label(a))}</div></span>
      <span class="ages">${a.last_in?"msg "+ago(a.last_in):"never"}<br>${a.last_out?"said "+ago(a.last_out):"—"}</span>
    </button>`;}).join("");
  document.querySelectorAll(".agent").forEach(el=>el.onclick=()=>showAgent(el.dataset.agent));

  renderPortfolio(b.products||[]);
  if(tab==="council") renderCouncil();
  if(tab==="vault") renderVault();
  if(openAgent) showAgent(openAgent, true);
}

function renderPortfolio(products){
  $("products").innerHTML = products.length ? products.map(p=>`
    <div class="card prod" style="margin-bottom:12px">
      <div class="phead"><span class="pname">${esc(p.name)}</span><span class="prev">${money(p.revenue)}</span></div>
      <div class="brief">${esc(p.brief||"")}${p.metric?` · goal: ${esc(p.metric)}`:""}${p.pm?` · PM ${esc(p.pm)}`:""}</div>
      ${(p.projects||[]).map(pr=>`<div class="proj"><div class="pj">${esc(pr.name)}</div>
        ${(pr.tasks||[]).map(t=>`<div class="task">
          <span class="st ${t.status}">${esc(t.status)}</span>
          <span style="flex:1;min-width:0">${esc(t.title)} <span class="muted">· ${esc(t.role)}${t.owner?" · "+esc(t.owner):""}</span></span>
          ${t.blocked_by&&t.blocked_by.length?`<span class="blk">blocked by #${t.blocked_by.join(", #")}</span>`:""}
        </div>`).join("")||'<div class="task muted">no tasks yet</div>'}</div>`).join("")||'<div class="muted" style="font-size:13px">no projects yet</div>'}
    </div>`).join("") : `<div class="card"><div class="row muted">No products yet.</div></div>`;
}

async function renderCouncil(){
  const d = await jget("api/councils"); const cs = (d&&d.councils)||[];
  $("councils").innerHTML = cs.length ? cs.map(c=>`
    <div class="card coun" style="margin-bottom:12px">
      <div class="q">${esc(c.question)}</div>
      ${c.answer?`<div class="ans">${esc(c.answer)}</div>`:`<div class="muted" style="font-size:13px">collecting views… (${(c.views||[]).length} in)</div>`}
      ${(c.views||[]).map(v=>`<div class="view"><b>${esc(v.agent)}</b>: ${esc(v.view)}</div>`).join("")}
    </div>`).join("") : `<div class="card"><div class="row muted">No council questions yet.</div></div>`;
}

async function renderVault(){
  const d = await jget("api/vault"); if(!d) return;
  $("secrets").innerHTML = (d.secrets||[]).length ? d.secrets.map(s=>`
    <div class="row vrow"><div>${esc(s.name)} <span class="sc">${esc(s.scope)}</span></div><div class="what">updated ${ago(s.updated)}</div></div>`).join("")
    : `<div class="row muted">No secrets stored.</div>`;
  $("reads").innerHTML = (d.reads||[]).length ? d.reads.map(r=>`
    <div class="row vrow"><div><b>${esc(r.agent)}</b> read ${esc(r.secret)}</div><div class="what">${ago(r.at)}</div></div>`).join("")
    : `<div class="row muted">No reads yet.</div>`;
}

async function showAgent(name, quiet){
  openAgent = name;
  const evs = await jget("api/timeline?agent="+encodeURIComponent(name)) || [];
  $("dname").textContent = name;
  $("tl").innerHTML = evs.length ? evs.map(e=>`<div class="ev ${e.dir}">
    <small>${({in:"→ "+esc(name),out:"← "+esc(name),waiting:"queued for "+esc(name),asked:esc(name)+" asked"})[e.dir]||esc(e.dir)} · #${e.item||"-"} · ${ago(e.at)}</small>${esc(e.text)}</div>`).join("")
    : `<div class="ev muted">No messages yet.</div>`;
  if(!quiet){ document.querySelectorAll("section").forEach(s=>s.hidden=true); $("detail").hidden=false; }
}

function selectTab(name){
  tab = name; openAgent = null;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", t.dataset.tab===name));
  ["overview","portfolio","council","vault","detail"].forEach(s=>$(s).hidden = s!==name);
  if(name==="council") renderCouncil(); if(name==="vault") renderVault();
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>selectTab(t.dataset.tab));
$("back").onclick = ()=>selectTab("overview");
load(); setInterval(load, 10000);
</script>
</body>
</html>
